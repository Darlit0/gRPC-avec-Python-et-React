services:
  backend:
    build: .
    # Module 5 : plusieurs répliques derrière Envoy (load balancing)
    deploy:
      replicas: 2
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-docker-secret-at-least-32-bytes}
    healthcheck:
      test: ["CMD", "python", "-c", "from grpc_health.v1 import health_pb2, health_pb2_grpc; import grpc; c=grpc.insecure_channel('localhost:50051'); health_pb2_grpc.HealthStub(c).Check(health_pb2.HealthCheckRequest())"]
      interval: 10s
      timeout: 3s
      retries: 5

  envoy:
    image: envoyproxy/envoy:v1.36-latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./envoy.docker.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml"]

  frontend:
    build: ./frontend
    depends_on:
      - envoy
    ports:
      - "5173:80"