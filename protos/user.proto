syntax = "proto3";
package user.v1;

message GetUserRequest {
  int32 user_id = 1;
}

message Address {
  string street = 1;
  string city = 2;
}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string nickname = 4;
  Address address = 5;
}

message GetUserResponse {
  User user = 1;
}

service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
}
