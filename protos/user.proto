syntax = "proto3";
package user.v1;

message GetUserRequest {
  int32 user_id = 1;
}

message ListUsersRequest {
}

message Address {
  string street = 1;
  string city = 2;
}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string nickname = 4;
  Address address = 5;
}

message GetUserResponse {
  User user = 1;
}

message CreateUsersResponse {
  int32 created_count = 1;
}

message ChatMessage {
  string text = 1;
  string author = 2;
  int64 sent_at_ms = 3;
}

message SubscribeChatRequest {
}

message SendChatMessageResponse {
  int32 subscriber_count = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 expires_at_ms = 2;
}

message ServerInfoRequest {
}

message ServerInfo {
  string hostname = 1;
  bool tls_enabled = 2;
}

service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc ListUsers (ListUsersRequest) returns (stream User);
  rpc CreateUsers (stream User) returns (CreateUsersResponse);
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);

  // Module 4 : chat temps réel compatible gRPC-Web (pas de bidi dans le navigateur)
  rpc SubscribeChat (SubscribeChatRequest) returns (stream ChatMessage);
  rpc SendChatMessage (ChatMessage) returns (SendChatMessageResponse);

  // Module 5 : authentification JWT et instance qui a répondu (load balancing)
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc GetServerInfo (ServerInfoRequest) returns (ServerInfo);
}
